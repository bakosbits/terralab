sources:
  proxmox_journal:
    type: journald
  
  docker_logs:
    type: docker_logs

transforms:
  # Process system logs from Journald
  process_system_logs:
    type: remap
    inputs: 
      - proxmox_journal
    source: |
      .node_name = get_env_var!("PARENT_HOST")
      .is_flap_event = "false"
      if contains(string!(.message), "arp: moved") {
          .is_flap_event = "true"
      }
      # Set defaults for labels used in the sink so it doesn't crash
      .job = "system"
      .task = "journald"
      .group = "os"
      .node = .node_name

  # Process logs coming from Nomad Docker containers
  process_nomad_logs:
    type: remap
    inputs:
      - docker_logs
    source: |
      .node_name = get_env_var!("PARENT_HOST")
      .node = .label."com.hashicorp.nomad.node_name"
      .group = .label."com.hashicorp.nomad.task_group_name"
      .task = .label."com.hashicorp.nomad.task_name"
      .job = .label."com.hashicorp.nomad.job_name"

      .ClientHost = "-"
      .RequestAddr = "-"
      .RequestMethod = "-"
      .RequestPath = "-"
      .DownstreamStatus = "-"

      if .job == "traefik" {
          parsed, err = parse_json(string!(.message))
          if err == null {
              . = merge!(., parsed)
              del(.message)
          }
      }
      
      del(.label)

sinks:
  loki_system_logs:
    type: loki
    inputs: 
      - process_system_logs
    endpoint: "http://loki.service.consul:3100"
    encoding:
      codec: json
    labels:
      job: "{{ job }}"
      task: "{{ task }}"
      group: "{{ group }}"
      node: "{{ node }}"
      host: "{{ node_name }}"
      source: "proxmox_host"
      flap: "{{ is_flap_event }}"

  loki_nomad_logs:
    type: loki
    inputs: 
      - process_nomad_logs
    endpoint: "http://loki.service.consul:3100"
    encoding:
      codec: json
    labels:
      job: "{{ job }}"
      task: "{{ task }}"
      group: "{{ group }}"
      node: "{{ node }}"
      host: "{{ node_name }}"
      client_host: "{{ ClientHost }}"
      request_address: "{{ RequestAddr }}"
      request_method: "{{ RequestMethod }}"
      request_path: "{{ RequestPath }}"
      http_status: "{{ DownstreamStatus }}"
      source: "nomad_host"