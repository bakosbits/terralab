entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
        
  websecure:
    address: :443
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "192.168.1.0/24"
        - "192.168.2.0/24"
        - "192.168.3.0/24"
        - "192.168.3.0/24"
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
    http:
      tls: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
    
  consulCatalog:
    exposedByDefault: false
    defaultRule: Host(`{{ normalize .Name }}.${tld}`)
    endpoint:
      address: 127.0.0.1:8500

global:
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: true

api:
  insecure: false
  dashboard: true
  debug: false
  disabledashboardad: true

# logs are sent to loki
log:
  level: INFO
#  filePath: "/etc/traefik/logs/traefik.log"

accessLog:
#  filePath: "/etc/traefik/logs/access.log"
  format: json
  filters:
    statusCodes:
      - 200
      - 300-302
      - 400-404
      - 500
