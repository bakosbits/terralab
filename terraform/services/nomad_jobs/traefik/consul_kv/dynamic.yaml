tls:
  certificates:
    - certFile: "/etc/traefik/certs/${tld}.fullchain"
      keyFile: "/etc/traefik/certs/${tld}.key"
  stores:
    default:
      defaultCertificate:
        certFile: "/etc/traefik/certs/${tld}.fullchain"
        keyFile: "/etc/traefik/certs/${tld}.key"


http:
  routers:
    nomad:
      service: nomad
      rule: Host(`nomad.${tld}`)
      entrypoints:
        - websecure
      middlewares:
        - auth@consulcatalog

    consul:
      service: consul
      rule: Host(`consul.${tld}`)
      entrypoints:
        - websecure
      middlewares:
        - auth@consulcatalog

    pfsense:
      service: pfsense
      rule: Host(`pfsense.${tld}`)
      entrypoints:
        - websecure

    proxmox:
      service: proxmox
      rule: Host(`pve.${tld}`)
      entrypoints:
        - websecure

    backup:
      service: backup
      rule: Host(`backup.${tld}`)
      entrypoints:
        - websecure

  services:
    nomad:
      loadbalancer:
        servers:
          - url: ${nomad_addr} 

    consul:
      loadbalancer:
        servers:
          - url: ${consul_addr}

    pfsense:
      loadbalancer:
        servers:
          - url: ${pfsense_addr}

    proxmox:
      loadbalancer:
        servers:
          - url: ${pve_addr}

    backup:
      loadbalancer:
        servers:
          - url: ${pve_backup_addr}