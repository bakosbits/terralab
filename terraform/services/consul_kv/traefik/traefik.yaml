entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
        
  websecure:
    address: :443
    http:
      tls: true
    proxyProtocol:
      trustedIPs:
        - 192.168.168.1

  postgres:
    address: :5432

# uncomment and populate if using LetsEncrypt
# certificatesResolvers:
#   myresolver:
#     acme:
#       email: "your-email@example.com"
#       storage: "/letsencrypt/acme.json"
#       dnsChallenge:
#         provider: "cloudflare"
#         resolvers:
#           - "1.1.1.1:53"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
    
  consulCatalog:
    exposedByDefault: false
    defaultRule: Host(`{{ normalize .Name }}.${domain}`)
    endpoint:
      address: 127.0.0.1:8500

global:
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: true

api:
  insecure: false
  dashboard: true
  debug: false
  disabledashboardad: true

# logs are sent to loki
log:
  level: INFO
#  filePath: "/etc/traefik/logs/traefik.log"

accessLog:
#  filePath: "/etc/traefik/logs/access.log"
  format: json
  filters:
    statusCodes:
      - 200
      - 300-302
      - 400-404
      - 500
